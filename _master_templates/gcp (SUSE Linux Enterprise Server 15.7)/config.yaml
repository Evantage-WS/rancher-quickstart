# https://github.com/mazzasaverio/terraform-gcp-cloud-run

# https://cloud.google.com/compute/docs/machine-resource
gcp_instance_type_rancher:                                      <change me> n1-standard-4 # Without SUSE Security, choose n1-standard-2
gcp_instance_type_downstream:                                   <change me> n1-standard-2
gcp_node_username:                                              <change me> some-name
gcp_prefix:                                                     <change me> some-unique-name
gcp_creator_tag:                                                <change me> Luke Skywalker

name_cloud_provider:                                            gcp # used in kubeconfig filenames
kubernetes_cluster_name:                                        <change me> rancher
downstream_kubernetes_cluster_name:                             <change me> downstream
kubeconfig_location:                                            ~/.kube

# https://artifacthub.io/packages/helm/cert-manager/cert-manager
cert_manager_version:                                           1.19.2

# https://artifacthub.io/packages/helm/rancher-stable/rancher
rancher_helm_repository:                                        https://releases.rancher.com/server-charts/stable
rancher_version:                                                2.13.1

# Kubernetes version to use for Rancher server cluster
# https://github.com/rancher/k3s/releases
rancher_kubernetes_version:                                     v1.33.6+k3s1
downstream_kubernetes_cluster_version:                          v1.33.6+k3s1

# https://artifacthub.io/packages/helm/neuvectorcharts/core
# https://artifacthub.io/packages/helm/neuvectorcharts/crd
install_suse_security:                                          true
suse_security_version:                                          5.4.7
